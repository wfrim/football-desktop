<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Playbook — desktop</title>
  <link rel="stylesheet" href="styles/base.css?v=c173a4c3">
  <link rel="stylesheet" href="styles/play.css?v=7d079acc">
  <link rel="stylesheet" href="styles/themes.css?v=c82dc36d">
  <link rel="stylesheet" href="styles/panel.css?v=84d0ff3c">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- Vignette sits UNDER the drawing: an overlay above an animating layer
       forces a full-screen recomposite every frame (see docs/ENERGY.md). -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- The field is static: its own SVG layer, never repainted while plays animate. -->
  <svg id="field-layer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated football play diagram"></svg>

  <div id="hud" class="hud">
    <header class="hud-title">
      <h1 class="hud-concept" data-part="concept"></h1>
      <p class="hud-matchup" data-part="matchup" hidden></p>
      <p class="hud-meta" data-part="meta"></p>
      <p class="hud-formation" data-part="formation"></p>
    </header>
    <footer class="hud-notes">
      <p class="hud-situation" data-part="situation"></p>
      <p class="hud-description" data-part="description"></p>
      <p class="hud-result" data-result></p>
      <p class="hud-note" data-note></p>
    </footer>
    <div class="hud-corner">
      <p class="hud-flag" data-part="flag" hidden></p>
      <button type="button" class="hud-counter" data-part="counter" title="Settings"></button>
    </div>
  </div>

  <!--
    Classic scripts (not ES modules) on purpose: they run from file://, which
    is how Plash loads a local page. Order matters: each file extends window.FD.
  -->
  <script src="src/renderer/svg.js?v=954a015b"></script>
  <script src="src/renderer/geometry.js?v=e3d90d6d"></script>
  <script src="src/layout/coordinates.js?v=45bd227b"></script>
  <script src="src/layout/responsive.js?v=85652b11"></script>
  <script src="src/animation/timeline.js?v=3b9a8902"></script>
  <script src="src/animation/animator.js?v=b49f1a87"></script>
  <script src="src/renderer/primitives.js?v=921f0db6"></script>
  <script src="src/renderer/routeRenderer.js?v=5301fd86"></script>
  <script src="src/renderer/formationRenderer.js?v=59d1169e"></script>
  <script src="src/renderer/fieldRenderer.js?v=7ea81b9f"></script>
  <script src="src/renderer/relationships.js?v=e0cb33fb"></script>
  <script src="src/defense/align.js?v=b9cc28fc"></script>
  <script src="src/renderer/defenseRenderer.js?v=e4d59cf2"></script>
  <script src="src/live/pairing.js?v=41534f12"></script>
  <script src="src/live/notes.js?v=54360491"></script>
  <script src="src/live/sim.js?v=6b1a5260"></script>
  <script src="src/renderer/playRenderer.js?v=453d83ab"></script>
  <script src="src/animation/choreography.js?v=4289fa22"></script>
  <script src="src/data/vocabulary.js?v=39bd3f0a"></script>
  <script src="src/data/resolve.js?v=a4221703"></script>
  <script src="src/data/concepts.js?v=1882bdaa"></script>
  <script src="src/data/loader.js?v=8ff3be46"></script>
  <script src="src/data/plays.bundle.js?v=9807a8d5"></script>
  <script src="src/fieldPosition.js?v=5041e21f"></script>
  <script src="src/drive.js?v=b2c43cc5"></script>
  <script src="src/data/playbooks.js?v=21851313"></script>
  <script src="src/playlist.js?v=7acea1e4"></script>
  <script src="src/settings.js?v=61567adb"></script>
  <script src="src/theme.js?v=3e22039f"></script>
  <script src="src/config.js?v=81f188cc"></script>
  <script src="src/hud.js?v=e7a11910"></script>
  <script src="src/pauseView.js?v=c4e477c4"></script>
  <script src="src/settingsPanel.js?v=ab79b7c2"></script>
  <script src="src/stage.js?v=9da26f07"></script>
  <script src="src/app.js?v=d912ad99"></script>
</body>
</html>
