<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Playbook — desktop</title>
  <link rel="stylesheet" href="styles/base.css?v=22160520">
  <link rel="stylesheet" href="styles/play.css?v=a198fdd0">
  <link rel="stylesheet" href="styles/themes.css?v=4bf491ee">
  <link rel="stylesheet" href="styles/panel.css?v=40f838f9">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- Vignette sits UNDER the drawing: an overlay above an animating layer
       forces a full-screen recomposite every frame (see docs/ENERGY.md). -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- The field is static: its own SVG layer, never repainted while plays animate. -->
  <svg id="field-layer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated football play diagram"></svg>

  <div id="hud" class="hud">
    <header class="hud-title">
      <h1 class="hud-concept" data-part="concept"></h1>
      <p class="hud-meta" data-part="meta"></p>
      <p class="hud-formation" data-part="formation"></p>
    </header>
    <footer class="hud-notes">
      <p class="hud-situation" data-part="situation"></p>
      <p class="hud-description" data-part="description"></p>
      <p class="hud-result" data-result></p>
    </footer>
    <div class="hud-corner">
      <p class="hud-flag" data-part="flag" hidden></p>
      <button type="button" class="hud-counter" data-part="counter" title="Settings"></button>
    </div>
  </div>

  <!--
    Classic scripts (not ES modules) on purpose: they run from file://, which
    is how Plash loads a local page. Order matters: each file extends window.FD.
  -->
  <script src="src/renderer/svg.js?v=954a015b"></script>
  <script src="src/renderer/geometry.js?v=9854b30c"></script>
  <script src="src/layout/coordinates.js?v=86557f9e"></script>
  <script src="src/layout/responsive.js?v=85652b11"></script>
  <script src="src/animation/timeline.js?v=9d34b780"></script>
  <script src="src/animation/animator.js?v=0756fb20"></script>
  <script src="src/renderer/primitives.js?v=921f0db6"></script>
  <script src="src/renderer/routeRenderer.js?v=5301fd86"></script>
  <script src="src/renderer/formationRenderer.js?v=59d1169e"></script>
  <script src="src/renderer/fieldRenderer.js?v=e1cebf2a"></script>
  <script src="src/renderer/relationships.js?v=288da0a1"></script>
  <script src="src/defense/align.js?v=4b09398c"></script>
  <script src="src/renderer/defenseRenderer.js?v=66abd290"></script>
  <script src="src/renderer/playRenderer.js?v=a53c760e"></script>
  <script src="src/animation/choreography.js?v=b21829cf"></script>
  <script src="src/data/vocabulary.js?v=c1b9f843"></script>
  <script src="src/data/resolve.js?v=88312d3e"></script>
  <script src="src/data/concepts.js?v=1fcf8ae6"></script>
  <script src="src/data/loader.js?v=8ff3be46"></script>
  <script src="src/data/plays.bundle.js?v=a25f745e"></script>
  <script src="src/fieldPosition.js?v=5041e21f"></script>
  <script src="src/drive.js?v=e8c3770b"></script>
  <script src="src/playlist.js?v=8460ae5d"></script>
  <script src="src/settings.js?v=95ed8761"></script>
  <script src="src/theme.js?v=19fd6eb6"></script>
  <script src="src/config.js?v=81f188cc"></script>
  <script src="src/hud.js?v=8fce5ece"></script>
  <script src="src/settingsPanel.js?v=7c878cac"></script>
  <script src="src/stage.js?v=62e1c149"></script>
  <script src="src/app.js?v=8f51e50f"></script>
</body>
</html>
